name: unidocs_mobile
description: UniDocs Mobile — Academic file management and sharing app.
publish_to: "none"
version: 2.5.0+25

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Routing
  go_router: ^14.2.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # PDF viewing
  syncfusion_flutter_pdfviewer: ^28.2.7

  # UI helpers
  intl: ^0.20.3
  file_picker: ^8.0.6
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  flutter_local_notifications: ^22.3.0
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n for ARB-based translations
  assets:
    - assets/images/
    - assets/icons/
