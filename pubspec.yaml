name: unidocs_mobile
description: UniDocs Mobile — Academic file management and sharing app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Routing
  go_router: ^14.2.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # Code generation friendly models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # PDF viewing
  syncfusion_flutter_pdfviewer: ^26.1.35

  # UI helpers
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  pull_to_refresh_flutter3: ^2.0.2
  file_picker: ^8.0.6
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n for ARB-based translations
  assets:
    - assets/images/
    - assets/icons/
