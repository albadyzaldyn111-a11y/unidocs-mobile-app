name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://unidocs-backend-api.onrender.com
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: unidocs-apk
          path: build/app/outputs/flutter-apk/app-release.apk
